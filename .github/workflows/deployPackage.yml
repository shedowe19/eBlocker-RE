name: Publish server package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build and test all server dependencies locally
        run: ./mvnw -B -ntp -pl apps/server -am install
      - name: Publish first-party server and parent after successful tests
        run: ./mvnw -B -ntp -pl build/parent,libs/crypto,libs/registration,apps/server deploy -DgithubRepository=${{ github.repository }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
